<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leeton — 14 Apr 2026</title>
  <style>
    :root {
      /* Modern Deep & Crisp Palette */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #0f172a;    /* Slate 900 */
      --secondary: #64748b;  /* Slate 500 */
      --accent: #10b981;     /* Emerald 500 */
      --accent-dark: #059669;
      --accent-soft: #ecfdf5;
      --border: #e2e8f0;     /* Slate 200 */
      --pick-bg: #f0f9ff;    /* Sky 50 */
      --pick-text: #0369a1;  /* Sky 700 */
      --winner-bg: #f0fdf4;
      --highlight: #f1f5f9;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--primary);
      background-color: var(--bg);
      line-height: 1.5;
    }

    .wrap { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 40px 20px; 
    }

    /* Hero Section */
    .hero {
      background: var(--primary);
      color: white;
      border-radius: 24px;
      padding: 40px;
      margin-bottom: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 42px; font-weight: 800; letter-spacing: -0.02em; }
    .sub { color: var(--secondary); font-size: 16px; margin-top: 8px; font-weight: 400; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }

    .summary-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
    }

    .summary-card .label { 
      display: block;
      font-size: 11px; 
      color: var(--secondary); 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .summary-card .value { font-size: 18px; font-weight: 600; color: white; }

    /* Navigation */
    .race-nav {
      position: sticky;
      top: 16px;
      z-index: 50;
      margin-bottom: 32px;
      padding: 8px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      scrollbar-width: none;
    }

    .race-nav::-webkit-scrollbar { display: none; }

    .race-nav a {
      text-decoration: none;
      white-space: nowrap;
      color: var(--secondary);
      background: transparent;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .race-nav a:hover {
      background: var(--highlight);
      color: var(--primary);
    }

    /* Race Cards */
    .race-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .race-head {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }

    .race-head h2 { margin: 0; font-size: 24px; font-weight: 700; color: var(--primary); }
    .race-head .top-pick { 
      font-size: 14px; 
      background: var(--accent-soft); 
      color: var(--accent-dark);
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: 600;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 9px 12px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: white;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: var(--highlight); }

    /* Special Rows */
    tr.top-pick-row { background: var(--pick-bg); }
    tr.top-pick-row:hover { background: #e0f2fe; }
    tr.result-winner { background: var(--winner-bg); }

    .horse-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .horse-cell strong { font-size: 15px; color: var(--primary); }
    .horse-cell .meta { color: var(--secondary); font-size: 12px; }

    .pill {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .pill.pick { background: var(--pick-text); color: white; }
    .pill.win { background: var(--accent); color: white; }
    .pill.fs { background: #7c3aed; color: white; }

    .muted { color: var(--secondary); opacity: 0.5; }

    /* ── Portrait mobile ── */
    @media (max-width: 820px) and (orientation: portrait) {
      .wrap { padding: 12px 8px; }
      h1 { font-size: 26px; }
      .hero { padding: 20px 16px; border-radius: 16px; margin-bottom: 16px; }
      .summary-grid { display: none; }
      .race-nav { margin-bottom: 16px; }
      .race-card { border-radius: 12px; margin-bottom: 16px; overflow-x: auto; }
      .race-head { padding: 12px 16px; flex-direction: column; align-items: flex-start; gap: 6px; }
      .race-head h2 { font-size: 18px; }
      .race-head .top-pick { font-size: 12px; }
      th, td { padding: 8px 10px; font-size: 12px; white-space: nowrap; }
      .horse-cell .meta { display: none; }
      .horse-cell strong { font-size: 13px; }
      th:nth-child(4), td:nth-child(4),
      th:nth-child(6), td:nth-child(6),
      th:nth-child(7), td:nth-child(7),
      th:nth-child(8), td:nth-child(8),
      th:nth-child(9), td:nth-child(9),
      th:nth-child(12), td:nth-child(12) { display: none; }
    }

    /* ── Landscape mobile / small tablet ── */
    @media (max-width: 1024px) and (orientation: landscape) {
      .wrap { padding: 12px 12px; }
      .hero { padding: 20px 24px; border-radius: 16px; margin-bottom: 16px; }
      h1 { font-size: 28px; }
      .race-card { margin-bottom: 16px; overflow-x: auto; }
      .race-head { padding: 12px 20px; }
      .race-head h2 { font-size: 20px; }
      th, td { padding: 8px 10px; font-size: 12px; white-space: nowrap; }
      .horse-cell .meta { display: none; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <span class="eyebrow">LE140426</span>
      <h1>Leeton — 14 Apr 2026</h1>
      <p class="sub">Harness Racing Model — Fair Odds &amp; Probabilities</p>
      <div class="summary-grid">
        <div class="summary-card">
          <span class="label">Meeting</span>
          <span class="value">LE140426</span>
        </div>
        
        <div class="summary-card">
          <span class="label">Track</span>
          <span class="value">Leeton</span>
        </div>
        
        <div class="summary-card">
          <span class="label">Date</span>
          <span class="value">14 Apr 2026</span>
        </div>
        
        <div class="summary-card">
          <span class="label">Races</span>
          <span class="value">0</span>
        </div>
        
        <div class="summary-card">
          <span class="label">Results Loaded</span>
          <span class="value">0</span>
        </div>
        
        <div class="summary-card">
          <span class="label">Winners</span>
          <span class="value">—</span>
        </div>
        
        <div class="summary-card">
          <span class="label">Generated</span>
          <span class="value">13 Apr 2026 20:49</span>
        </div>
        </div>
    </section>
    <nav class="race-nav">
      <a href="index.html">All meetings</a>
      
    </nav>
    <div class="race-card"><p>No races found for this meeting.</p></div>
  </div>
</body>
</html>
